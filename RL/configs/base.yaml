generator_checkpoint: outputs/generator/checkpoints/best.ckpt
predictor_d:
  checkpoint: outputs/predictor/D/graph_to_smiles/checkpoints/best_model.pt
  architecture: graph_distilled
predictor_rho:
  checkpoint: outputs/predictor/r0/distilled/checkpoints/best.ckpt
  architecture: multimodal_distilled
training:
  device: cuda:0
  seed: 42
  save_dir: outputs/RL
  max_len: 256
  steps: 20000
  batch_size: 512
  gen_batch_size: 512
  lr: 0.0001
  sigma: 5.0
  grad_clip: 1.0
  temperature: 1.0
  top_k: 10
  use_experience_replay: false
  replay_buffer_size: 1000
  replay_batch_size: 64
  update_prior_every: 2500
  eval_every: 5000
  save_every: 5000
  eval_n_samples: 10000
  eval_batch: 512
  n_workers: 8
  w_detonation: 1.0
  w_sascore: 1.0
  w_density: 1.0
  invalid_penalty: -5.0
  enable_bonus: true
